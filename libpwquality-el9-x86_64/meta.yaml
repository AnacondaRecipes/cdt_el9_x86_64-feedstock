package:
  name: libpwquality-el9-x86_64
  version: 1.4.4

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/BaseOS/x86_64/os/Packages/l/libpwquality-1.4.4-8.el9.x86_64.rpm
    sha256: d572dfa42d099b58e29fc0c1431c80e1baa4d0555265f79b1a346ebe99ac9ae1
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-64 2.34.*
  host:
  run:
    - sysroot_linux-64 2.34.*
    - cracklib-el9-x86_64 >=2.9.6 *_{{ build_number }}
    - cracklib-dicts-el9-x86_64 >=2.9.6 *_{{ build_number }}
    - pam-el9-x86_64 >=1.5.1 *_{{ build_number }}  # [with_pam]

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libpwquality.so.1
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libpwquality.so.1.0.2

about:
  home: https://github.com/libpwquality/libpwquality/
  license: BSD-3-Clause or GPL-2.0-only  # BSD or GPLv2+
  license_family: Other
  license_file:
    - COPYING
  summary: (CDT) A library for password generation and password quality checking
  description: |
    This is a library for password quality checks and generation
    of random passwords that pass the checks.
    This library uses the cracklib and cracklib dictionaries
    to perform some of the checks.
  doc_url: https://github.com/libpwquality/libpwquality/
  dev_url: https://github.com/libpwquality/libpwquality/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
