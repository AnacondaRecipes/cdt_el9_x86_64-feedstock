package:
  name: java-1.8.0-openjdk-devel-el9-x86_64
  version: 1.8.0.452b9

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/AppStream/x86_64/os/Packages/j/java-1.8.0-openjdk-devel-1.8.0.452.b09-2.el9.x86_64.rpm
    sha256: 387d99b17cc06bb3465b5362e6f7959e170421769d6983df83acb5b10ba787c8
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-64 2.34.*
  host:
  run:
    - sysroot_linux-64 2.34.*
    - java-1.8.0-openjdk-el9-x86_64 ==1.8.0.452b9 *_{{ build_number }}

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.452.b09-2.el9.x86_64/lib/tools.jar
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.452.b09-2.el9.x86_64/tapset/hotspot-1.8.0.452.b09-2.el9.x86_64.stp

