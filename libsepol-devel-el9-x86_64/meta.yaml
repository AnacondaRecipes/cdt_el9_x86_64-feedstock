package:
  name: libsepol-devel-el9-x86_64
  version: 3.6

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/AppStream/x86_64/os/Packages/l/libsepol-devel-3.6-1.el9.x86_64.rpm
    sha256: ff527e80a3ffc2ca8fad962653da008ef0fb7b702afa2738deab1b4372dd3815
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - sysroot_linux-64 2.34.*
    - libsepol-el9-x86_64 ==3.6 *_{{ build_number }}

test:
  requires:
    - pkg-config
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/include/sepol/sepol.h
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libsepol.so
    - export PKG_CONFIG_PATH=${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/pkgconfig
    - pkg-config --cflags libsepol

about:
  home: https://github.com/SELinuxProject/selinux/wiki
  license: LGPL-2.1-only  # LGPLv2+
  license_family: LGPL
  license_file:
    - LICENSE
  summary: (CDT) Header files and libraries used to build policy manipulation tools
  description: |
    The libsepol-devel package contains the libraries and header files
    needed for developing applications that manipulate binary policies.
  doc_url: https://github.com/SELinuxProject/selinux/wiki
  dev_url: https://github.com/SELinuxProject/selinux/wiki

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
