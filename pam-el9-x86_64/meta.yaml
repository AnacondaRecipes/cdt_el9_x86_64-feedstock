package:
  name: pam-el9-x86_64
  version: 1.5.1

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/BaseOS/x86_64/os/Packages/p/pam-1.5.1-22.el9_5.x86_64.rpm
    sha256: 3b0cd3b64740e2278d3f1a8920c82b41fa9090ab694817f713a1a7dbabab8b1e
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-64 2.34.*
  host:
  run:
    - sysroot_linux-64 2.34.*
    - audit-libs-el9-x86_64 >=3.1.5 *_{{ build_number }}
    - libdb-el9-x86_64 >=5.3.28 *_{{ build_number }}
    - libeconf-el9-x86_64 >=0.4.1 *_{{ build_number }}
    - libpwquality-el9-x86_64 >=1.4.4 *_{{ build_number }}
    - libselinux-el9-x86_64 >=3.6 *_{{ build_number }}
    - libxcrypt-el9-x86_64 >=4.4.18 *_{{ build_number }}
    - openssl 3  # libcrypto.so.3

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libpam.so.0
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libpam.so.0.85.1

about:
  home: http://www.linux-pam.org/
  license: BSD-3-Clause or GPL-2.0-only  # BSD and GPLv2+
  license_family: GPL2
  license_file:
    - Copyright
    - gpl-2.0.txt
  summary: (CDT) An extensible library which provides authentication for applications
  description: |
    PAM (Pluggable Authentication Modules) is a system security tool that
    allows system administrators to set authentication policy without
    having to recompile programs that handle authentication.
  doc_url: http://www.linux-pam.org/
  dev_url: http://www.linux-pam.org/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
