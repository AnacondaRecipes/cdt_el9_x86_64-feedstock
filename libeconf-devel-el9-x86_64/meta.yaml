package:
  name: libeconf-devel-el9-x86_64
  version: 0.4.1

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/devel/x86_64/os/Packages/l/libeconf-devel-0.4.1-4.el9.x86_64.rpm
    sha256: abe8a8f7589238097f93535a5df2490cb4bcfe15d099888b99a0613b6ee49443
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - libeconf-el9-x86_64 ==0.4.1 *_{{ build_number }}

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libeconf.so

about:
  home: https://github.com/openSUSE/libeconf
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
  summary: (CDT) Development files for libeconf
  description: |
    The libeconf-devel package contains libraries and header files for
    developing applications that use libeconf.
  doc_url: https://github.com/openSUSE/libeconf
  dev_url: https://github.com/openSUSE/libeconf

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
