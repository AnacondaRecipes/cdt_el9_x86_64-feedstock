package:
  name: kmod-devel-el9-x86_64
  version: 28

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/devel/x86_64/os/Packages/k/kmod-devel-28-10.el9.x86_64.rpm
    sha256: 76887fa1dcdcbe179f6deb5183c2f9a6cffabeb80bcfc6eee80df08a199849f3
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - kmod-libs-el9-x86_64 ==28 *_{{ build_number }}

test:
  requires:
    - pkg-config
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/include/libkmod.h
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libkmod.so
    - export PKG_CONFIG_PATH=${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/pkgconfig
    - pkg-config --cflags libkmod

about:
  home: https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git
  license: LGPL-2.1-only  # GPLv2+
  license_family: GPL2
  license_file:
    - COPYING
  summary: (CDT) Header files for kmod development
  description: |
    The kmod-devel package provides header files used for development of
    applications that wish to load or unload Linux kernel modules.
  doc_url: https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git
  dev_url: https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
