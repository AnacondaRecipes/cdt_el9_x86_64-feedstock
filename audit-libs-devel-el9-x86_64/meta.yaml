package:
  name: audit-libs-devel-el9-x86_64
  version: 3.1.5

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/AppStream/x86_64/os/Packages/a/audit-libs-devel-3.1.5-1.el9.x86_64.rpm
    sha256: dcd0621ee8a49d2a4b379d97f8ecee3e33ade8ab07fd55ad354b400881de9dd8
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - sysroot_linux-64 2.34.*
    - audit-libs-el9-x86_64 ==3.1.5 *_{{ build_number }}
    - libcap-ng-devel-el9-x86_64 >=0.8.2 *_{{ build_number }}

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/include/libaudit.h
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/include/auparse.h
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libaudit.so
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libauparse.so

about:
  home: http://people.redhat.com/sgrubb/audit/
  license: LGPL-2.1-only  # LGPLv2+
  license_family: LGPL
  license_file:
    - lgpl-2.1.txt
  summary: (CDT) Header files for libaudit
  description: |
    The audit-libs-devel package contains the header files needed for
    developing applications that need to use the audit framework libraries.
  doc_url: http://people.redhat.com/sgrubb/audit/
  dev_url: http://people.redhat.com/sgrubb/audit/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
