package:
  name: libdb-el9-x86_64
  version: 5.3.28

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/BaseOS/x86_64/os/Packages/l/libdb-5.3.28-54.el9.x86_64.rpm
    sha256: d32cf8a7c3f631d5b0bafcdf5fa6bf6c8438ccd5d0466943310ad8deef886f15
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - '*'

requirements:
  build:
    - sysroot_linux-64 2.34.*
  host:
  run:
    - sysroot_linux-64 2.34.*

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libdb-5.so
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libdb-5.3.so

about:
  home: http://www.oracle.com/database/berkeley-db/
  license: MIT  # BSD and LGPLv2 and Sleepycat and MIT
  license_family: MIT
  license_file:
    - LICENSE
    - lgpl-2.1.txt
  summary: (CDT) The Berkeley DB database library for C
  description: |
    The Berkeley Database (Berkeley DB) is a programmatic toolkit that
    provides embedded database support for both traditional and
    client/server applications. The Berkeley DB includes B+tree, Extended
    Linear Hashing, Fixed and Variable-length record access methods,
    transactions, locking, logging, shared memory caching, and database
    recovery. The Berkeley DB supports C, C++, and Perl APIs. It is
    used by many applications, including Python and Perl, so this should
    be installed on all systems.
  doc_url: http://www.oracle.com/database/berkeley-db/
  dev_url: http://www.oracle.com/database/berkeley-db/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
