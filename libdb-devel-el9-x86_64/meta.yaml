package:
  name: libdb-devel-el9-x86_64
  version: 5.3.28

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/AppStream/x86_64/os/Packages/l/libdb-devel-5.3.28-54.el9.x86_64.rpm
    sha256: b0ae7c0fe86db1b885605ab6c697b3a5e848f251564e7289baadf42576175fc4
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - libdb-el9-x86_64 ==5.3.28 *_{{ build_number }}

test:
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libdb.so

about:
  home: http://www.oracle.com/database/berkeley-db/
  license: MIT  # BSD and LGPLv2 and Sleepycat and MIT
  license_family: MIT
  license_file:
    - LICENSE
  summary: (CDT) C development files for the Berkeley DB library
  description: |
    The Berkeley Database (Berkeley DB) is a programmatic toolkit that
    provides embedded database support for both traditional and
    client/server applications. This package contains the header files,
    libraries, and documentation for building programs which use the
    Berkeley DB.
  doc_url: http://www.oracle.com/database/berkeley-db/
  dev_url: http://www.oracle.com/database/berkeley-db/

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
