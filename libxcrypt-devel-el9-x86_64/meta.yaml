package:
  name: libxcrypt-devel-el9-x86_64
  version: 4.4.18

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/AppStream/x86_64/os/Packages/l/libxcrypt-devel-4.4.18-3.el9.x86_64.rpm
    sha256: f98951be16cb84133ac14201348a202c9884f8958f908b6040fb5db12e4dba81
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - sysroot_linux-64 2.34.*
    - libxcrypt-el9-x86_64 ==4.4.18 *_{{ build_number }}

test:
  requires:
    - pkg-config
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/include/crypt.h
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libcrypt.so
    - export PKG_CONFIG_PATH=${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/pkgconfig
    - pkg-config --cflags libcrypt
    - pkg-config --cflags libxcrypt

# LICENSING says LGPL-2.1-or-later, COPYING.LIB is that license
about:
  home: https://github.com/besser82/libxcrypt
  license: LGPL-2.1-or-later  # LGPLv2+ and BSD and Public Domain
  license_family: LGPL
  license_file:
    - AUTHORS
    - LICENSING
    - COPYING.LIB
  summary: (CDT) Development files for libxcrypt
  description: |
    The libxcrypt-devel package contains libraries and header files for
    developing applications that use libxcrypt.
  doc_url: https://github.com/besser82/libxcrypt
  dev_url: https://github.com/besser82/libxcrypt

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
