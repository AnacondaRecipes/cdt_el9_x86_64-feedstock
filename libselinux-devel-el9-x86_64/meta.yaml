package:
  name: libselinux-devel-el9-x86_64
  version: 3.6

source:
  - url: https://download.rockylinux.org/vault/rocky/9.5/AppStream/x86_64/os/Packages/l/libselinux-devel-3.6-1.el9.x86_64.rpm
    sha256: 53f451c22a43535c5542c1c41fcb3acd44b013be171367ba54436cd235a5edc1
    no_hoist: true
    folder: binary

build:
  skip: True  # [not (linux and x86_64)]
  number: {{ build_number }}
  noarch: generic
  binary_relocation: false
  detect_binary_files_with_prefix: false

requirements:
  host:
  run:
    - sysroot_linux-64 2.34.*
    - libselinux-el9-x86_64 ==3.6 *_{{ build_number }}
    - libsepol-el9-x86_64 >=3.6 *_{{ build_number }}
    - libsepol-devel-el9-x86_64 >=3.6 *_{{ build_number }}
    - pcre2

test:
  requires:
    - pkg-config
  commands:
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/include/selinux/selinux.h
    - test -f ${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/libselinux.so
    - export PKG_CONFIG_PATH=${PREFIX}/x86_64-conda_el9-linux-gnu/sysroot/usr/lib64/pkgconfig
    - pkg-config --cflags libselinux

about:
  home: https://github.com/SELinuxProject/selinux/wiki
  license: libselinux-1.0  # Public Domain
  license_family: Other
  license_file:
    - LICENSE
  summary: (CDT) Header files and libraries used to build SELinux
  description: |
    The libselinux-devel package contains the libraries and header files
    needed for developing SELinux applications.
  doc_url: https://github.com/SELinuxProject/selinux/wiki
  dev_url: https://github.com/SELinuxProject/selinux/wiki

extra:
  recipe-maintainers:
    - conda-forge/help-cdts
